<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-c11cfd55-1e38-4a0d-8147-f94cbaacf2f2/styles.css">
  <script src="_ds/modernist-c11cfd55-1e38-4a0d-8147-f94cbaacf2f2/_ds_bundle.js"></script>
</helmet>
<div role="alertdialog" aria-modal="true" style="position:fixed; inset:0; z-index:10070; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4); padding:16px; box-sizing:border-box;">
  <div class="vc-r" style="width:100%; max-width:420px; max-height:calc(100vh - 32px); overflow:auto; box-sizing:border-box; padding:24px; border-radius:24px; border:1px solid #f6d0b1; background:#ffffff; box-shadow:0 20px 25px -5px rgba(126,62,32,.1), 0 8px 10px -6px rgba(126,62,32,.1);">
    <h3 style="margin:0; font-family:var(--font-heading); font-weight:700; font-size:22px; line-height:1.2; color:#7e3e20;">Cambiá tu contraseña</h3>
    <p style="margin:8px 0 16px; font-size:14px; line-height:1.5; color:#5c5249;">Por seguridad, cambiá la contraseña que te dio el restaurante (tu número de documento) por una propia.</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <sc-for list="{{ campos }}" as="p" hint-placeholder-count="3"><div class="field" style="margin:0;"><label>{{ p.label }}</label><div style="position:relative;"><input class="input vc-input" type="{{ p.type }}" aria-invalid="{{ p.inv }}" value="{{ p.value }}" onChange="{{ p.onChange }}" style="padding-right:40px;" /><button type="button" onClick="{{ p.toggle }}" aria-label="{{ p.aria }}" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:30px; height:30px; display:grid; place-items:center; border:none; background:transparent; color:#7e3e20; cursor:pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.icon }}"></path></svg></button></div><sc-if value="{{ p.err }}" hint-placeholder-val="{{ false }}"><p style="margin:2px 0 0; font-size:12px; color:#a8532a;">{{ p.err }}</p></sc-if><sc-if value="{{ p.hint }}" hint-placeholder-val="{{ false }}"><p class="text-muted" style="margin:2px 0 0; font-size:11px;">{{ p.hint }}</p></sc-if></div></sc-for>
    </div>
    <div style="margin-top:18px; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px;"><button type="button" class="btn btn-secondary" onClick="{{ ahoraNo }}">Ahora no</button><button type="button" class="btn btn-primary" onClick="{{ cambiar }}">Cambiar contraseña</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:640},&quot;claveActual&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;documento&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onCambiar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(nueva: string) =&gt; void&quot;},&quot;onAhoraNo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  EYE = 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z';
  EYE_OFF = 'M3 3l18 18 M10.6 10.6a2 2 0 0 0 2.8 2.8 M9.9 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2 M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6';
  state = { pw: { actual: '', nueva: '', conf: '' }, err: {}, ver: {} };
  norm(v) { return String(v || '').replace(/[.\s-]/g, '').toUpperCase(); }
  cambiar = () => {
    const p = this.state.pw; const pr = this.props || {}; const actual = pr.claveActual || ''; const e = {};
    if (!p.actual) e.actual = 'Este campo es obligatorio'; else if (p.actual !== actual) e.actual = 'La contraseña actual es incorrecta';
    if (!p.nueva) e.nueva = 'Este campo es obligatorio';
    else if (p.nueva.length < 8 || p.nueva.length > 64) e.nueva = 'Tiene que tener entre 8 y 64 caracteres';
    else if (String(pr.email || '').trim().toLowerCase() === p.nueva.trim().toLowerCase()) e.nueva = 'La contraseña no puede ser igual al mail';
    else if (this.norm(pr.documento) && this.norm(p.nueva) === this.norm(pr.documento)) e.nueva = 'La contraseña no puede ser tu número de documento';
    else if (p.nueva === actual) e.nueva = 'La nueva contraseña no puede ser igual a la actual';
    if (!p.conf) e.conf = 'Este campo es obligatorio'; else if (p.nueva && p.conf !== p.nueva) e.conf = 'Las contraseñas no coinciden';
    if (e.actual || e.nueva || e.conf) { this.setState({ err: e }); return; }
    if (pr.onCambiar) pr.onCambiar(p.nueva);
  };
  renderVals() {
    const s = this.state;
    const def = [['actual', 'Contraseña actual', 'Es tu número de documento, sin puntos.'], ['nueva', 'Nueva contraseña', ''], ['conf', 'Confirmar nueva contraseña', '']];
    return {
      campos: def.map(([k, label, hint]) => ({ label, hint: s.err[k] ? '' : hint, err: s.err[k] || '', inv: s.err[k] ? 'true' : 'false', value: s.pw[k], type: s.ver[k] ? 'text' : 'password', icon: s.ver[k] ? this.EYE_OFF : this.EYE, aria: s.ver[k] ? 'Ocultar contraseña' : 'Mostrar contraseña',
        onChange: (ev) => { const v = ev.target.value; this.setState((st) => ({ pw: { ...st.pw, [k]: v }, err: { ...st.err, [k]: '' } })); }, toggle: () => this.setState((st) => ({ ver: { ...st.ver, [k]: !st.ver[k] } })) })),
      cambiar: this.cambiar, ahoraNo: () => this.props && this.props.onAhoraNo && this.props.onAhoraNo()
    };
  }
}
</script>
</body>
</html>
